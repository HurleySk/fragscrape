<!DOCTYPE html>
<html>
<head><title>Test Perfume Page</title></head>
<body>
  <div class="user-menu">
    <a href="/Users/TestUser">TestUser</a>
  </div>

  <div class="collection-button" data-action="collection">
    <span class="heart-button">♡</span>
  </div>
  <div class="collection-dropdown" style="display:none;">
    <div data-collection="wishlist" class="collection-wishlist">Wishlist</div>
    <div data-collection="i_have" class="collection-ihave">I have</div>
    <div data-collection="tested" class="collection-tested">Tested</div>
    <div data-collection="i_had" class="collection-ihad">I had</div>
  </div>

  <div class="rating-container my-rating user-rating">
    <div class="scent-rating">
      <input data-rating="scent" type="range" min="0" max="10" step="0.5" value="8.5" />
    </div>
    <div class="longevity-rating">
      <input data-rating="longevity" type="range" min="0" max="10" step="0.5" value="7" />
    </div>
    <div class="sillage-rating">
      <input data-rating="sillage" type="range" min="0" max="10" step="0.5" value="6.5" />
    </div>
    <div class="bottle-rating">
      <input data-rating="bottle" type="range" min="0" max="10" step="0.5" value="9" />
    </div>
    <div class="value-rating">
      <input data-rating="value" type="range" min="0" max="10" step="0.5" value="7" />
    </div>
  </div>

  <div class="review-form write-review">
    <div class="my-review">
      <div class="text review-body">Existing review text here.</div>
    </div>
    <textarea class="review-text" name="review">Existing review text here.</textarea>
    <button class="review-submit" type="submit">Submit Review</button>
    <button class="review-delete">Delete</button>
  </div>
</body>
</html>
